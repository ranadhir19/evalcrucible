[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalcrucible"
version = "0.1.0"
description = "Prove your graders: a grader-validation and benchmark-audit toolkit for agent builders — validate graders against labelled data and audit static prompt-to-gold suites for broken tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["agent-evaluation", "llm-evals", "grader-validation", "benchmark-audit", "ai-agents", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
evalcrucible = "run_eval:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/evalcrucible"

[tool.setuptools]
py-modules = ["agents", "audit", "experiment", "graders", "suite", "run_eval"]
